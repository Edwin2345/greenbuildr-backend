schema:
  - schema.graphql

exec:
  filename: graph/generated.go
  package: graph

federation:
  filename: graph/federation.go
  package: graph
  version: 2

model:
  filename: graph/model.go
  package: graph

resolver:
  layout: follow-schema
  dir: graph
  package: graph
  filename_template: "{name}.resolvers.go"
