version: '3.8'

services:
  # Auth Service Database
  auth-db:
    image: mysql:8.0
    container_name: auth-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: auth_db
    ports:
      - "3306:3306"
    volumes:
      - ./auth-service/init.sql:/docker-entrypoint-initdb.d/init.sql
      - auth-db-data:/var/lib/mysql
    networks:
      - greenbuildr-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10

  # Auth Service (internal only — not exposed to host)
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: auth-service
    environment:
      PORT: 4001
      DB_HOST: auth-db
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: auth_db
      JWT_SECRET: ${JWT_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: onboarding@resend.dev
      FRONTEND_URL: http://localhost:3000
      TEMPLATES_DIR: /root/templates
    volumes:
      - ./auth-service/adapters/email/templates:/root/templates
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - greenbuildr-network
    restart: unless-stopped

  # Apollo Router (internal only — not exposed to host)
  apollo-router:
    image: ghcr.io/apollographql/router:v1.58.0
    container_name: apollo-router
    volumes:
      - ./router.yaml:/dist/config/router.yaml:ro
      - ./supergraph.graphql:/dist/schema/supergraph.graphql:ro
    command: >
      --config /dist/config/router.yaml
      --supergraph /dist/schema/supergraph.graphql
      --dev
      --listen 0.0.0.0:4100
    environment:
      APOLLO_ROUTER_ELV2_LICENSE: accept
    depends_on:
      - auth-service
    networks:
      - greenbuildr-network
    restart: unless-stopped

  # Apollo Auth Proxy (client-facing — only externally exposed service)
  apollo-auth:
    build:
      context: .
      dockerfile: apollo-auth/Dockerfile
    container_name: apollo-auth
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      CLIENT_SECRET: ${CLIENT_SECRET}
      APOLLO_ROUTER_URL: http://apollo-router:4100
    depends_on:
      - apollo-router
    networks:
      - greenbuildr-network
    restart: unless-stopped

volumes:
  auth-db-data:

networks:
  greenbuildr-network:
    driver: bridge
